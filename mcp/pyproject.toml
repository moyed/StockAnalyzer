[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stockanalyzer-mcp"
version = "0.1.0"
description = "MCP server for the StockAnalyzer PSX platform"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
stockanalyzer-mcp = "server:mcp"

[tool.hatch.build.targets.wheel]
packages = ["."]
